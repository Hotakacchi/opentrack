[package]
name = "opentrack-agent"
version = "0.3.0"
edition = "2021"
description = "Lightweight laptop finder agent for OpenTrack"
license = "MIT"

[dependencies]
# OS-native TLS (schannel on Windows): no bundled crypto, keeps the exe small.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Devices_Geolocation",
    "Foundation",
    "Graphics_Imaging",
    "Media_Capture",
    "Media_MediaProperties",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
